specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - name: USDCRebalancer
    kind: ethereum
    network: mainnet
    source:
      address: '0x839E57080C18195D8D343a02c2f623b5916f7383'
      abi: Rebalancer
      startBlock: 24277032
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Wallet
        - Variable
        - Withdraw
      abis:
        - name: Rebalancer
          file: ./abis/Rebalancer.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: FeeCharged(indexed address,uint256)
          handler: handleFeeCharged
      file: ./src/rebalancer.ts

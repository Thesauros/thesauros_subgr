specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - name: USDCRebalancer
    kind: ethereum
    network: arbitrum-one
    source:
      address: "0x9D943b1F93A6a931FB2E0E0De1D1B4F3e2A1A72D"
      abi: Rebalancer
      startBlock: 401575059
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Wallet
        - Variable
        - Withdraw
      abis:
        - name: Rebalancer
          file: ./abis/Rebalancer.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: FeeCharged(indexed address,uint256)
          handler: handleFeeCharged
      file: ./src/rebalancer.ts

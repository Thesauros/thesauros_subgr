specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - name: USDCRebalancer
    kind: ethereum
    network: base
    source:
      address: '0x4C7e55689aCcC42562E113e04c3BDe1B2eb76622'
      abi: Rebalancer
      startBlock: 35882448 
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Wallet
        - Variable
        - Withdraw
      abis:
        - name: Rebalancer
          file: ./abis/Rebalancer.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: FeeCharged(indexed address,uint256)
          handler: handleFeeCharged
      file: ./src/rebalancer.ts

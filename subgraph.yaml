specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - name: USDCRebalancer
    kind: ethereum
    network: base
    source:
      address: '0xCA6029f2d5f5d36DA047206Ae7A254Fa80F579B8'
      abi: Rebalancer
      startBlock: 42024291 
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Wallet
        - Variable
      abis:
        - name: Rebalancer
          file: ./abis/Rebalancer.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: FeesApplied(uint256,uint256,uint256,uint256)
          handler: handleFeesApplied
      file: ./src/rebalancer.ts
